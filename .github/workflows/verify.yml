name: Verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private page-turn library
        env:
          PAGE_TURN_DEPLOY_KEY: ${{ secrets.PAGE_TURN_DEPLOY_KEY }}
        run: |
          test -n "$PAGE_TURN_DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PAGE_TURN_DEPLOY_KEY" > "$HOME/.ssh/page_turn_deploy_key"
          chmod 600 "$HOME/.ssh/page_turn_deploy_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/page_turn_deploy_key -o IdentitiesOnly=yes" \
            git -c url."git@github.com:".insteadOf=https://github.com/ \
              submodule update --init --depth 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
