name: Publish Android APK publicly (manual)

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: Finished EAS Android production-apk build ID
        required: true
        type: string
      release_notes:
        description: Optional public release notes
        required: false
        type: string
      prerelease:
        description: Publish as a GitHub pre-release
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Download and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Checkout private page-turn library
        env:
          PAGE_TURN_DEPLOY_KEY: ${{ secrets.PAGE_TURN_DEPLOY_KEY }}
        run: |
          test -n "$PAGE_TURN_DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PAGE_TURN_DEPLOY_KEY" > "$HOME/.ssh/page_turn_deploy_key"
          chmod 600 "$HOME/.ssh/page_turn_deploy_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/page_turn_deploy_key -o IdentitiesOnly=yes" \
            git -c url."git@github.com:".insteadOf=https://github.com/ \
              submodule update --init --depth 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find existing production APK
        working-directory: apps/persimmon
        env:
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
        run: |
          if ! [[ "$EAS_BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Invalid EAS build ID: $EAS_BUILD_ID" >&2
            exit 1
          fi

          eas build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          test "$(jq -r '.platform' "$RUNNER_TEMP/eas-build.json")" = "ANDROID"
          test "$(jq -r '.status' "$RUNNER_TEMP/eas-build.json")" = "FINISHED"
          test "$(jq -r '.buildProfile' "$RUNNER_TEMP/eas-build.json")" = "production-apk"

      - name: Download exact EAS artifact
        run: |
          build_url="$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl' "$RUNNER_TEMP/eas-build.json")"
          test -n "$build_url"
          test "$build_url" != "null"

          mkdir -p dist
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$build_url" \
            --output dist/Persimmon-android-source.apk

      - name: Publish verified APK to GitHub Releases and Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.PERSIMMON_READER_RELEASE_TOKEN }}
          PERSIMMON_RELEASE_NOTES: ${{ inputs.release_notes }}
          PERSIMMON_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: pnpm publish:android:apk -- dist/Persimmon-android-source.apk
