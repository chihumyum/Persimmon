name: Publish existing Android APK (manual)

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: Finished EAS Android production-apk build ID
        required: true
        type: string

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Download and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find existing production APK
        working-directory: apps/persimmon
        env:
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
        run: |
          if ! [[ "$EAS_BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Invalid EAS build ID: $EAS_BUILD_ID" >&2
            exit 1
          fi

          eas build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          test "$(jq -r '.platform' "$RUNNER_TEMP/eas-build.json")" = "ANDROID"
          test "$(jq -r '.status' "$RUNNER_TEMP/eas-build.json")" = "FINISHED"
          test "$(jq -r '.buildProfile' "$RUNNER_TEMP/eas-build.json")" = "production-apk"

      - name: Download exact EAS artifact
        run: |
          build_url="$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl' "$RUNNER_TEMP/eas-build.json")"
          test -n "$build_url"
          test "$build_url" != "null"

          mkdir -p dist
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$build_url" \
            --output dist/Persimmon-android-source.apk

      - name: Verify and publish APK to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm publish:android:apk -- dist/Persimmon-android-source.apk
