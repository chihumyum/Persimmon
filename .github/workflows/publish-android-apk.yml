name: Build and publish Android APK publicly (manual)

on:
  workflow_dispatch:
    inputs:
      build_locally:
        description:
          Build on the GitHub runner instead of waiting in the EAS queue
        required: true
        default: false
        type: boolean
      eas_build_id:
        description:
          Optional finished EAS production-apk build ID (leave blank to build)
        required: false
        type: string
      release_notes:
        description: Optional public release notes
        required: false
        type: string
      prerelease:
        description: Publish as a GitHub pre-release
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build, verify, and publish signed APK
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    # The free EAS queue has taken close to three hours; GitHub caps a job at 360.
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Set up Java for the runner build
        if: inputs.build_locally
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android verification tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build or select the exact production APK
        if: ${{ !inputs.build_locally }}
        working-directory: apps/persimmon
        env:
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
        run: |
          if [[ -n "$EAS_BUILD_ID" ]]; then
            if ! [[ "$EAS_BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "Invalid EAS build ID: $EAS_BUILD_ID" >&2
              exit 1
            fi
            eas build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          else
            eas build \
              --platform android \
              --profile production-apk \
              --non-interactive \
              --wait \
              --json > "$RUNNER_TEMP/eas-build-list.json"
            test "$(jq 'length' "$RUNNER_TEMP/eas-build-list.json")" = "1"
            jq '.[0]' "$RUNNER_TEMP/eas-build-list.json" > "$RUNNER_TEMP/eas-build.json"
          fi

          test "$(jq -r '.platform' "$RUNNER_TEMP/eas-build.json")" = "ANDROID"
          test "$(jq -r '.status' "$RUNNER_TEMP/eas-build.json")" = "FINISHED"
          test "$(jq -r '.buildProfile' "$RUNNER_TEMP/eas-build.json")" = "production-apk"
          test "$(jq -r '.gitCommitHash' "$RUNNER_TEMP/eas-build.json")" = "$GITHUB_SHA"

          build_id="$(jq -r '.id' "$RUNNER_TEMP/eas-build.json")"
          test -n "$build_id"
          test "$build_id" != "null"
          {
            echo "### Android production build"
            echo
            echo "- EAS build ID: \`$build_id\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the signed APK on this runner
        if: inputs.build_locally
        working-directory: apps/persimmon
        env:
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
        run: |
          if [[ -n "$EAS_BUILD_ID" ]]; then
            echo "Choose either a runner build or an existing EAS build ID."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/dist/Persimmon-android-source.apk"
          test -s "$GITHUB_WORKSPACE/dist/Persimmon-android-source.apk"
          {
            echo "### Android production build"
            echo
            echo "- Builder: GitHub runner using EAS production credentials"
            echo "- Source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download exact EAS artifact
        if: ${{ !inputs.build_locally }}
        run: |
          build_url="$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl' "$RUNNER_TEMP/eas-build.json")"
          test -n "$build_url"
          test "$build_url" != "null"

          mkdir -p dist
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$build_url" \
            --output dist/Persimmon-android-source.apk

      - name: Publish verified APK to GitHub Releases and Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PERSIMMON_RELEASE_NOTES: ${{ inputs.release_notes }}
          PERSIMMON_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          PERSIMMON_RELEASE_TARGET: ${{ github.sha }}
        run: pnpm publish:android:apk -- dist/Persimmon-android-source.apk
