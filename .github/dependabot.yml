version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@expo/*"
        - "expo*"
    open-pull-requests-limit: 5
    ignore:
      # This package carries a version-specific Android rendering patch.
      # Upgrade it manually together with patches/@shopify__react-native-skia@*.patch.
      - dependency-name: "@shopify/react-native-skia"
    groups:
      expo-and-react-native:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
          - "@react-native/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
