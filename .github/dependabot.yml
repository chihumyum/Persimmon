version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@expo/*"
        - "expo*"
    open-pull-requests-limit: 5
    ignore:
      # These packages carry version-specific local patches.
      # Upgrade them manually together with their files under patches/.
      - dependency-name: "@expo/ui"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "image-size"
      # Expo SDK selects the compatible React Native family versions.
      # Upgrade them through the Expo SDK workflow instead of independently.
      - dependency-name: "react-native*"
      - dependency-name: "@react-native/*"
    groups:
      expo-and-react-native:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
          - "@react-native/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
