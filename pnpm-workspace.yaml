packages:
  - apps/*
  - packages/*
  - vendor/react-native-natural-page-turn/packages/*

# Dependabot enforces a 72-hour release-age window, while the pinned Expo SDK
# can require a newer @expo/metro-runtime release to resolve the existing lockfile.
minimumReleaseAgeExclude:
  - "@expo/metro-runtime"

onlyBuiltDependencies:
  - "@shopify/react-native-skia"
  - esbuild

patchedDependencies:
  "@expo/ui@57.0.11": patches/@expo__ui@57.0.11.patch
  "@shopify/react-native-skia@2.6.2": patches/@shopify__react-native-skia@2.6.2.patch
  "image-size@1.2.1": patches/image-size@1.2.1.patch
