packages:
  - apps/*
  - packages/*
  - vendor/react-native-natural-page-turn/packages/*

# Dependabot enforces a 72-hour release-age window, while Expo SDK releases
# coordinated versions across the expo and @expo package families.
minimumReleaseAgeExclude:
  - "@expo/*"
  - "expo*"

onlyBuiltDependencies:
  - "@shopify/react-native-skia"
  - esbuild

patchedDependencies:
  "@expo/ui": patches/@expo__ui.patch
  "@shopify/react-native-skia@2.6.2": patches/@shopify__react-native-skia@2.6.2.patch
  "image-size@1.2.1": patches/image-size@1.2.1.patch
